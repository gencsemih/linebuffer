<html lang="en">

    <meta name="application-edition" content="web-demo" />
    <title>OSD Design Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%20width%3D%22512%22%20height%3D%22512%22%20role%3D%22img%22%20aria-label%3D%22Linebuffer%20app%20icon%22%3E%0A%20%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%230B0F18%22%2F%3E%0A%20%20%3Cg%20transform%3D%22translate(72%20144)%20scale(9.68)%22%3E%0A%20%20%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%23F4F6FA%22%2F%3E%0A%20%20%3Crect%20x%3D%228%22%20y%3D%220%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%23F4F6FA%22%2F%3E%0A%20%20%3Crect%20x%3D%2216%22%20y%3D%220%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%23F4F6FA%22%2F%3E%0A%20%20%3Crect%20x%3D%2224%22%20y%3D%220%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%23F4F6FA%22%2F%3E%0A%20%20%3Crect%20x%3D%2232%22%20y%3D%220%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%23F4F6FA%22%2F%3E%0A%20%20%3Crect%20x%3D%220%22%20y%3D%228%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%23F4F6FA%22%2F%3E%0A%20%20%3Crect%20x%3D%228%22%20y%3D%228%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%23F4F6FA%22%2F%3E%0A%20%20%3Crect%20x%3D%2216%22%20y%3D%228%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%23D9A521%22%2F%3E%0A%20%20%3Crect%20x%3D%2224%22%20y%3D%228%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%23F4F6FA%22%20opacity%3D%220.18%22%2F%3E%0A%20%20%3Crect%20x%3D%2232%22%20y%3D%228%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%23F4F6FA%22%20opacity%3D%220.18%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f18; --panel: #151b2b; --panel2: #1b2334; --border: #2a3348;
        --text: #dce3ee; --dim: #8a94a8; --accent: #4f9dff; --warn: #f9c74f; --err: #ef476f; --ok: #5ed39a;
        --canvas-bg: #0f1420;
        --brand-accent: #D9A521;
      }
      body.theme-light {
        color-scheme: light;
        --bg: #f4f6fa; --panel: #ffffff; --panel2: #eef1f7; --border: #d3dae6;
        --text: #1b2733; --dim: #5f6b7e; --accent: #2f7ae5; --warn: #b7791f; --err: #c1274f; --ok: #1f8f5b;
        --canvas-bg: #e6eaf2;
        --brand-accent: #CC9A1E;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
      button, input, select, textarea, optgroup { font-family: inherit; font-size: inherit; }
      input, select, progress { accent-color: var(--accent); }
      #app { display: flex; flex-direction: column; height: 100vh; }
      header { display: flex; flex-direction: column; gap: 6px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
      /* In-page title bar (desktop shell only, 16.2): scoped to body.custom-titlebar, which the
         renderer adds once the shell confirms it removed the system title bar. */
      body.custom-titlebar #titleBarRow { margin: -8px -14px 0; padding: 6px 10px 6px 14px; border-bottom: 1px solid var(--border); background: var(--panel2); user-select: none; -webkit-user-select: none; }
      #titleBarDrag { flex: 1 1 auto; align-self: stretch; min-width: 0; }
      #windowControls { display: flex; align-items: center; gap: 4px; margin-left: auto; }
      .win-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 26px; padding: 0; background: transparent; border: 1px solid transparent; border-radius: 5px; color: var(--dim); cursor: pointer; }
      .win-btn svg { width: 12px; height: 12px; }
      .win-btn svg line, .win-btn svg rect { stroke: currentColor; stroke-width: 1.4; fill: none; stroke-linecap: round; }
      .win-btn:hover { background: var(--panel); border-color: var(--border); color: var(--text); }
      .win-close:hover { background: #ef476f; border-color: #ef476f; color: #fff; }
      .resize-grip { position: fixed; z-index: 60; }
      .resize-grip[data-edge="north"] { top: 0; left: 6px; right: 6px; height: 4px; cursor: ns-resize; }
      .resize-grip[data-edge="south"] { bottom: 0; left: 6px; right: 6px; height: 4px; cursor: ns-resize; }
      .resize-grip[data-edge="west"] { left: 0; top: 6px; bottom: 6px; width: 4px; cursor: ew-resize; }
      .resize-grip[data-edge="east"] { right: 0; top: 6px; bottom: 6px; width: 4px; cursor: ew-resize; }
      .resize-grip[data-edge="north-west"] { top: 0; left: 0; width: 8px; height: 8px; cursor: nwse-resize; }
      .resize-grip[data-edge="north-east"] { top: 0; right: 0; width: 8px; height: 8px; cursor: nesw-resize; }
      .resize-grip[data-edge="south-west"] { bottom: 0; left: 0; width: 8px; height: 8px; cursor: nesw-resize; }
      .resize-grip[data-edge="south-east"] { bottom: 0; right: 0; width: 8px; height: 8px; cursor: nwse-resize; }
      .header-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
      .brand { display: flex; align-items: center; gap: 10px; }
      /* linebuffer lockup: looping mark + wordmark; the static mark replaces the animation under reduced motion. */
      .brand .logo { display: inline-flex; align-items: center; gap: 0.36em; font-size: 17px; color: var(--text); }
      .brand .logo svg { height: 0.44em; width: auto; display: block; }
      .brand .logo .mk-static { display: none; }
      @media (prefers-reduced-motion: reduce) { .brand .logo .mk-anim { display: none; } .brand .logo .mk-static { display: block; } }
      .brand .logo .wm { font-weight: 700; letter-spacing: -0.025em; line-height: 1; }
      .brand .sep { color: var(--dim); font-size: 14px; }
      .brand h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
      .brand .version { color: var(--dim); font-size: 11px; }
      .brand .by { color: var(--dim); font-size: 11px; }
      /* Menu bar */
      #menuBar { display: flex; gap: 2px; align-items: center; }
      .menu { position: relative; }
      .menu > button { background: transparent; border: 1px solid transparent; color: var(--text); padding: 4px 10px; border-radius: 5px; cursor: pointer; }
      .menu > button:hover, .menu.open > button { background: var(--panel2); border-color: var(--border); }
      .menu .dropdown { display: none; position: absolute; top: 100%; left: 0; min-width: 220px; background: var(--panel); border: 1px solid var(--border);
        border-radius: 6px; padding: 4px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
      .menu.open .dropdown { display: block; }
      .dropdown button, .dropdown label { display: flex; width: 100%; text-align: left; background: transparent; border: 0; color: var(--text);
        padding: 6px 10px; border-radius: 4px; cursor: pointer; align-items: center; gap: 8px; }
      .dropdown button:hover, .dropdown label:hover { background: var(--panel2); }
      .dropdown button:disabled { color: var(--dim); cursor: default; }
      .dropdown .sep { height: 1px; background: var(--border); margin: 4px 2px; }
      .dropdown .shortcut { margin-left: auto; color: var(--dim); font-size: 11px; }
      .spacer { flex: 1; }
      /* Info bar */
      .infobar { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
      .infobar .item { padding: 4px 10px; display: flex; flex-direction: column; gap: 1px; border-right: 1px solid var(--border); min-width: 80px; }
      .infobar .item:last-child { border-right: 0; }
      .infobar .k { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--dim); }
      .infobar .v { font-size: 12px; }
      .dirty { color: var(--warn); }
      /* View switcher */
      #viewTabs { display: flex; gap: 4px; }
      #viewTabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--dim); padding: 6px 10px; cursor: pointer; }
      #viewTabs button.active { color: var(--text); border-bottom-color: var(--accent); }
      #viewTabs.segmented { border: 1px solid var(--border); border-radius: 6px; padding: 2px; gap: 0; }
      #viewTabs.segmented button { border: 0; border-radius: 4px; }
      #viewTabs.segmented button.active { background: var(--panel2); }
      #rail { display: none; flex-direction: column; gap: 4px; padding: 8px 6px; background: var(--panel); border-right: 1px solid var(--border); }
      #rail button { width: 54px; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--dim); padding: 6px 2px; cursor: pointer; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
      #rail button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
      #rail button.active { color: var(--text); background: var(--panel2); border-color: var(--border); }
      body.switcher-rail #viewTabs { display: none; }
      body.switcher-rail #rail { display: flex; }
      /* Main */
      main { display: flex; flex: 1; min-height: 0; }
      .view { display: none; flex: 1; min-width: 0; min-height: 0; }
      .view.active { display: flex; }
      .cols { display: flex; flex: 1; min-width: 0; min-height: 0; }
      .side { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 160px; width: 240px; overflow: hidden; }
      .side.right { border-right: 0; border-left: 1px solid var(--border); width: 300px; }
      .side h2, .card h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--dim); margin: 0; padding: 8px 10px 4px; }
      .side .scroll { overflow: auto; flex: 1; padding: 0 6px 8px; }
      .gutter { width: 5px; cursor: col-resize; background: transparent; }
      .gutter:hover, .gutter.dragging { background: var(--accent); }
      .center { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .toolbar { display: flex; gap: 10px; align-items: stretch; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
      .tsec { display: flex; flex-direction: column; gap: 3px; padding: 0 10px; border-right: 1px solid var(--border); }
      .tsec:last-child { border-right: 0; }
      .tsec .row { display: flex; gap: 6px; align-items: center; flex: 1; }
      .tsec .lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--dim); text-align: center; }
      .toolbar button, .side button, .card button, .dialog button, .pane button { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 4px 9px; border-radius: 5px; cursor: pointer; }
      .toolbar button:hover, .side button:hover, .card button:hover, .pane button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.active { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.small { padding: 2px 6px; font-size: 11px; }
      input[type="text"], input[type="number"], select, textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 3px 6px; border-radius: 4px; }
      input[type="number"] { width: 70px; }
      input[type="range"] { vertical-align: middle; }
      /* Canvas area */
      #canvasWrap { flex: 1; overflow: auto; background: var(--canvas-bg); position: relative; }
      #canvasStage { position: relative; display: inline-block; margin: 24px; }
      #osdCanvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
      #overlayCanvas { position: absolute; left: 0; top: 0; pointer-events: none; }
      #osdCanvas.inspect { cursor: default; }
      #osdCanvas.edit { cursor: crosshair; }
      /* Lists */
      .list { list-style: none; margin: 0; padding: 0; }
      .list li { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
      .list li:hover { background: var(--panel2); }
      .list li.selected { background: var(--panel2); outline: 1px solid var(--accent); }
      .list li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .list li .type { color: var(--dim); font-size: 10px; }
      .list li .icon { width: 14px; text-align: center; color: var(--dim); font-size: 11px; cursor: pointer; }
      .list li .icon.on { color: var(--accent); }
      .list li.dragover { border-top: 2px solid var(--accent); }
      /* Cards / inspector */
      .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; margin: 6px 0; padding: 4px 8px 8px; }
      .field { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 6px; margin: 4px 0; }
      .field label { color: var(--dim); font-size: 11px; }
      .field input[type="text"], .field select, .field textarea { width: 100%; }
      .field .inline { display: flex; gap: 4px; align-items: center; }
      .field .inline input[type="number"] { width: 56px; }
      .swatch { display: inline-block; width: 14px; height: 14px; border: 1px solid var(--border); border-radius: 3px; vertical-align: middle; margin-right: 4px; }
      .palette-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
      .palette-grid .pal { height: 22px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; position: relative; }
      .palette-grid .pal.sel { outline: 2px solid var(--accent); }
      .palette-grid .pal span { position: absolute; left: 2px; top: 1px; font-size: 9px; color: #fff; text-shadow: 0 0 2px #000; }
      /* Tables */
      table.grid { width: 100%; border-collapse: collapse; }
      table.grid th, table.grid td { border-bottom: 1px solid var(--border); padding: 4px 6px; text-align: left; }
      table.grid th { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; cursor: pointer; }
      table.grid tr:hover td { background: var(--panel2); }
      table.grid tr.selected td { background: var(--panel2); }
      table.grid td.editable { cursor: text; }
      /* Panes (project/export/assets) */
      .pane { flex: 1; overflow: auto; padding: 12px 16px; }
      .pane h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--dim); margin: 14px 0 6px; }
      .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
      .tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--dim); padding: 6px 10px; cursor: pointer; }
      .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
      .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .stat { display: inline-flex; flex-direction: column; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; margin: 0 8px 8px 0; min-width: 110px; }
      .stat .k { font-size: 9.5px; text-transform: uppercase; color: var(--dim); letter-spacing: 0.6px; }
      .stat .v { font-size: 15px; }
      .stat.over .v { color: var(--err); }
      .artifact { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; align-items: center; }
      .artifact .fn { font-family: ui-monospace, monospace; font-size: 12px; }
      .artifact .what { color: var(--dim); font-size: 11px; }
      .artifact .done { color: var(--ok); font-size: 11px; }
      .artifact .fail { color: var(--err); font-size: 11px; }
      .drc li { padding: 3px 0; cursor: pointer; }
      .drc .sev-error { color: var(--err); } .drc .sev-warn { color: var(--warn); }
      pre.code { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-size: 11px; overflow: auto; max-height: 300px; }
      /* Runtime panel */
      .rt-buttons { display: flex; gap: 4px; flex-wrap: wrap; }
      .rt-buttons button { min-width: 48px; }
      /* Status bar */
      #status { padding: 4px 14px; background: var(--panel); border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; min-height: 24px; display: flex; gap: 12px; }
      #status .msg { flex: 1; }
      /* Dialogs */
      .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
      .backdrop.open { display: flex; }
      .dialog { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; min-width: 360px; max-width: 720px; max-height: 85vh; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
      .dialog h2 { margin: 0 0 10px; font-size: 16px; }
      .dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
      .dialog .choices { display: grid; gap: 8px; }
      .dialog .choices button { text-align: left; padding: 10px 12px; }
      .dialog .choices small { display: block; color: var(--dim); }
      .kbd { font-family: ui-monospace, monospace; background: var(--panel2); border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; font-size: 11px; }
      .shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; }
      .shortcuts h4 { grid-column: 1 / -1; margin: 10px 0 2px; font-size: 11px; color: var(--dim); text-transform: uppercase; }
      .shortcuts div { display: flex; justify-content: space-between; gap: 10px; }
      .hint { color: var(--dim); font-size: 11px; }
      .row-actions { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
      .glyph-editor { display: grid; gap: 1px; background: var(--border); border: 1px solid var(--border); width: max-content; }
      .glyph-editor div { width: 14px; height: 14px; background: var(--bg); cursor: pointer; }
      .glyph-editor div.on { background: var(--text); }
      .glyph-strip { display: flex; flex-wrap: wrap; gap: 2px; }
      .glyph-strip canvas { border: 1px solid var(--border); cursor: pointer; image-rendering: pixelated; }
      .glyph-strip canvas.sel { outline: 2px solid var(--accent); }
    </style>
  </head>
